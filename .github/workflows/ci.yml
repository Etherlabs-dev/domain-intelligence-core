name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m json.tool notebooks/02_training_run.ipynb >/dev/null
      - run: python -m json.tool notebooks/03_eval_results.ipynb >/dev/null
      - run: pytest -q
